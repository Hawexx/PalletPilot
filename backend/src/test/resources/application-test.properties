# ─── PalletPilot TEST Profile ────────────────────────
# Used by @ActiveProfiles("test") in integration tests.
# H2 in-memory DB — no PostgreSQL needed.

spring.datasource.url=jdbc:h2:mem:palletpilot_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA — auto-create schema (not validate, H2 has no Flyway migrations)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway disabled for test (DDL auto-managed by Hibernate)
spring.flyway.enabled=false

# Disable hardware simulation (no external deps)
app.simulation.enabled=true

# License skip
license.skip-check=true

# Rate limiting off for tests
app.rate-limit.enabled=false

# Disable scheduled tasks to prevent interference
spring.task.scheduling.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
