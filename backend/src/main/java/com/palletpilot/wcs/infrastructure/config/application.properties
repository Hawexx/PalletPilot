spring.application.name=palletpilot-wcs

# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/palletpilot
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Application Specific - Simulation Mode
# Set to 'false' to try connecting to real hardware (will fail if not present)
# Set to 'true' to use the SimulatedHardwareClient
app.simulation.enabled=true

# Hardware Configuration (Defaults)
hardware.movu.base-url=http://localhost:9000
hardware.kuka.ip=192.168.1.10
hardware.kuka.port=30002
hardware.beckhoff.ams-net-id=192.168.1.20.1.1
hardware.beckhoff.port=851
