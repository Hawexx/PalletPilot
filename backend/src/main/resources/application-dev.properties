# ─── PalletPilot DEV Profile ─────────────────────────
# Activate: --spring.profiles.active=dev

# Simulation mode ON for local testing
app.simulation.enabled=true

# Relaxed rate limiting for development
app.rate-limit.requests-per-minute=1000

# Show SQL for debugging
spring.jpa.show-sql=true

# Debug-level logging for app code
logging.level.com.palletpilot=DEBUG

# License bypass in dev
