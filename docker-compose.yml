# PalletPilot — Docker Compose (Production-Ready)
# Usage:
#   1. cp .env.example .env && edit .env
#   2. docker compose up -d
#
# Dashboard: http://localhost:3000
# API:       http://localhost:8080
# Swagger:   http://localhost:8080/swagger-ui.html
# Health:    http://localhost:8080/actuator/health

services:
  # ─── PostgreSQL Database ──────────────────────────
  db:
    image: postgres:16-alpine
    container_name: palletpilot-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: palletpilot
      POSTGRES_USER: palletpilot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-palletpilot_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palletpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Spring Boot Backend ──────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: palletpilot-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # ── Profile & Database ──
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/palletpilot
      SPRING_DATASOURCE_USERNAME: palletpilot
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-palletpilot_dev}
      # ── Schema Migration (Flyway) ──
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      # ── Security ──
      API_KEY: ${WCS_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # ── License ──
      LICENSE_SKIP_CHECK: ${LICENSE_SKIP_CHECK:-true}
      LICENSE_OFFLINE_GRACE: "true"
      LICENSE_KEY: ${LICENSE_KEY:-CHANGE_ME}
      # ── Integration Secrets ──
      MOVU_API_KEY: ${MOVU_API_KEY:-}
      ERP_WEBHOOK_SECRET: ${ERP_WEBHOOK_SECRET:-}
      WMS_PASSWORD: ${WMS_PASSWORD:-}
      # ── JVM Tuning ──
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ─── Next.js Frontend ────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: palletpilot-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
    driver: local

